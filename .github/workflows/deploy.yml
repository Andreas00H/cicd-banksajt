# CI/CD för banksajten.
# Körs vid push till main och vid pull requests mot main.
# 1. Kontrollera frontend (Next.js) och backend (Express).
# 2. Om båda klarar sig och det är en push till main: deploya till EC2.

name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Kontrollera frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  backend:
    name: Kontrollera backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check backend syntax
        working-directory: ./backend
        run: |
          node --check server.js
          node --check db.js

  deploy:
    name: Deploy till EC2
    # Startar bara om BÅDA kontrollerna ovan lyckades
    needs: [frontend, backend]
    # Deploya bara vid push till main, aldrig vid pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Bara en deploy åt gången. En ny push väntar tills den förra är klar.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Deploy med Docker Compose på EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          # Next.js-bygget tar några minuter på servern
          command_timeout: 30m
          script: |
            set -e
            cd /home/ubuntu/cicd-banksajt
            git pull
            sudo docker compose up -d --build
            sudo docker image prune -f
            sudo docker compose ps
